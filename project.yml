name: LifeOS
options:
  bundleIdPrefix: com.surajmenon
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: LifeOS
        excludes:
          - "**/.DS_Store"
          - "**/LiveActivityWidget/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surajmenon.lifeos
        INFOPLIST_KEY_CFBundleDisplayName: LifeOS
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: LifeOS/Info.plist
      properties:
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: LifeOS can look up place names for IRL events. Your live location is not required for search.
    dependencies:
      - target: LifeOSLiveActivityWidget
  LifeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LifeOSTests
    dependencies:
      - target: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surajmenon.lifeos.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LifeOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LifeOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LifeOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LifeOSUITests
    dependencies:
      - target: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surajmenon.lifeos.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LifeOS
  LifeOSLiveActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LifeOS/LiveActivity
      - path: LifeOS/LiveActivityWidget
      - path: LifeOS/Models
      - path: LifeOS/Utilities
        excludes:
          - "**/CalendarFilterState.swift"
          - "**/EntryDeleteModifier.swift"
          - "**/GameIdentity.swift"
          - "**/NotificationPreset.swift"
      - path: LifeOS/Services
        excludes:
          - "**/EntryTemplates.swift"
          - "**/EntryStore.swift"
          - "**/NotificationPlanner.swift"
          - "**/LifeOSDataMigration.swift"
          - "**/RecapExporter.swift"
          - "**/LifeOSNotificationDelegate.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surajmenon.lifeos.liveactivity
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
    info:
      path: LifeOS/LiveActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: LifeOS Live Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  LifeOS:
    build:
      targets:
        LifeOS: all
        LifeOSTests: [test]
        LifeOSUITests: [test]
    test:
      targets:
        - LifeOSTests
        - LifeOSUITests
    run:
      config: Debug
